# dsh-multi-provider-usage — profile bundle patch.
#
# `dsh plugin --profile <name> add dsh-multi-provider-usage` installs this package
# and, because package.json declares `dsh.bundle.patch`, reconciles it into the
# profile's `dsh.profile.bundles` layer stack automatically. This file is that
# bundle layer: it inserts the plugin entry with schema defaults; user
# overrides live in the entry's config (Settings → Plugins → Plugin
# configuration, or the bundle's own settings page).
#
# `name` MUST be the package's resolvable module specifier: the cordis loader
# imports exactly this string from the profile directory, where the package
# exists.
- insert:
    - id: dsh-multi-provider-usage
      name: "dsh-multi-provider-usage"
