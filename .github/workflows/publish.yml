name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing (OIDC): the job proves its identity to npm without a
  # long-lived token. Also required for --provenance.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Test
        run: npm test
      - name: Publish
        # NPM_TOKEN (a granular token with 2FA bypass) is used when present.
        # Without it the variable is unset, so npm falls back to trusted
        # publishing: the job exchanges its OIDC token for a short-lived
        # credential and no secret needs to live in the repository.
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then unset NODE_AUTH_TOKEN; fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
