name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing (OIDC): the job proves its identity to npm without a
  # long-lived token. Also required for --provenance.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Test
        run: npm test
      - name: Publish (trusted publishing)
        # The default path: the job exchanges its OIDC token for a short-lived
        # npm credential. Nothing secret is stored in the repository.
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --access public --provenance
      - name: Publish (token fallback)
        # Only used when a granular token is configured as NPM_TOKEN; setting an
        # empty NODE_AUTH_TOKEN would make npm treat the run as authenticated.
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
